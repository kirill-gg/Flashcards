name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать и найти проект
        run: |
          mkdir -p unpacked
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d unpacked
          done
          F=$(find unpacked -name settings.gradle.kts | head -1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts не найден. Содержимое:"
            find unpacked | head -60
            exit 1
          fi
          echo "Проект: $F"
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Сборка
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Копировать APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/Flashcards.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: Flashcards.apk 
